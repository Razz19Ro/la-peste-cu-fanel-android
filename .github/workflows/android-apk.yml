
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "la-peste-cu-fanel.zip"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses

      - name: Extract project
        run: |
          unzip -q la-peste-cu-fanel.zip
          test -f la-peste-cu-fanel/frontend/package.json

      - name: Install dependencies
        working-directory: la-peste-cu-fanel/frontend
        run: |
          chmod +x ./scripts/cmd-guard.js
          corepack enable
          yarn install --frozen-lockfile

      - name: Generate Android project
        working-directory: la-peste-cu-fanel/frontend
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: la-peste-cu-fanel/frontend/android
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: La-Peste-cu-Fanel-APK
          path: la-peste-cu-fanel/frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
