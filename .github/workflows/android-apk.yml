
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "la-peste-cu-fanel.zip"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -q la-peste-cu-fanel.zip
          test -f la-peste-cu-fanel/frontend/package.json

      - name: Install dependencies
        working-directory: la-peste-cu-fanel/frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Generate Android project
        working-directory: la-peste-cu-fanel/frontend
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: la-peste-cu-fanel/frontend/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: La-Peste-cu-Fanel-APK
          path: la-peste-cu-fanel/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
